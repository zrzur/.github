name: Feature request
description: Suggest an idea or an improvement for Zrzur.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Zrzur is a volunteer project, so not every request can be built, and there are no promised dates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Zrzur help here?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you have tried
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots or examples. Remove private data first.
